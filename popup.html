<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto Reject Cookies</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .row:last-child { border-bottom: none; }
    label { font-size: 13px; }
    .switch {
      position: relative;
      width: 38px;
      height: 20px;
      display: inline-block;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(18px); }
    .stat {
      font-size: 22px;
      font-weight: 600;
      color: #2e7d32;
    }
    .stat-label {
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🍪 Auto Reject Cookies</h1>

  <div class="row">
    <label for="enabled">Enabled everywhere</label>
    <span class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </span>
  </div>

  <div class="row">
    <label for="siteToggle">Enabled on this site</label>
    <span class="switch">
      <input type="checkbox" id="siteToggle" />
      <span class="slider"></span>
    </span>
  </div>

  <div class="row" style="border-bottom:none; padding-top:14px;">
    <div>
      <div class="stat" id="totalHandled">0</div>
      <div class="stat-label">banners auto-rejected (all time)</div>
    </div>
  </div>
</body>
<script src="popup.js"></script>
</html>
